<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PasaBuy Portal</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1115;
      --surface: #171a21;
      --surface-2: #1e222b;
      --border: #2a2f3a;
      --text: #e6e8ec;
      --muted: #9aa1ad;
      --accent: #5b9dff;
      --danger: #ff6b6b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      font-size: 14px;
    }

    /* Login */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 28px;
      width: 100%;
      max-width: 380px;
    }

    .login-box h1 { font-size: 18px; margin-bottom: 4px; }
    .login-box .sub { color: var(--muted); font-size: 12px; margin-bottom: 20px; }

    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }

    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
    }

    input[type="password"]:focus { outline: none; border-color: var(--accent); }

    .btn {
      background: var(--accent);
      color: #0b1220;
      border: none;
      border-radius: 6px;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:hover { filter: brightness(1.08); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .btn-full { width: 100%; margin-top: 16px; }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      font-weight: 400;
    }

    .msg-error {
      color: var(--danger);
      font-size: 12px;
      margin-top: 12px;
      min-height: 16px;
    }

    /* Portal */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand { font-weight: 700; }
    .brand small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }

    main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }

    .tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      padding: 8px 12px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .count { color: var(--muted); font-size: 12px; }

    .table-scroll {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    table { width: 100%; border-collapse: collapse; }

    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th {
      background: var(--surface-2);
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      position: sticky;
      top: 0;
    }

    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: rgba(91, 157, 255, .06); }

    td a { color: var(--accent); }

    .state {
      padding: 32px;
      text-align: center;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .state.error { color: var(--danger); border-color: var(--danger); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="login" class="login-wrap hidden">
    <form class="login-box" id="login-form">
      <h1>PasaBuy Portal</h1>
      <div class="sub">Enter the portal password to continue.</div>
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn btn-full" id="login-btn" type="submit">Unlock</button>
      <div class="msg-error" id="login-error"></div>
    </form>
  </div>

  <div id="portal" class="hidden">
    <header>
      <div class="header-inner">
        <div class="brand">PasaBuy Portal<small>Notion-backed order management</small></div>
        <button class="btn btn-ghost" id="logout">Log out</button>
      </div>
    </header>

    <main>
      <nav class="tabs" id="tabs"></nav>
      <div class="toolbar">
        <div class="count" id="count"></div>
        <button class="btn btn-ghost" id="refresh">Refresh</button>
      </div>
      <div id="view"><div class="state">Loading…</div></div>
    </main>
  </div>

  <script>
    const API_URL = "https://ck-pasaubuy.vercel.app/api/notion";
    const TABS = [
      ["invoices", "Invoices"],
      ["invoice_lines", "Invoice Lines"],
      ["clients", "Clients"],
      ["products", "Products"],
      ["pricebook", "Pricebook"],
      ["payments", "Payments"],
    ];

    const $ = (id) => document.getElementById(id);
    const esc = (v) =>
      String(v).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
      );

    let token = null;
    let activeTab = TABS[0][0];

    async function fetchDb(db, tok) {
      const res = await fetch(`${API_URL}?db=${encodeURIComponent(db)}`, {
        headers: { "X-Portal-Token": tok },
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        const err = new Error(body.error || `Request failed (${res.status})`);
        err.status = res.status;
        throw err;
      }
      return res.json();
    }

    // Login
    $("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pw = $("pw").value;
      const btn = $("login-btn");
      $("login-error").textContent = "";
      btn.disabled = true;
      btn.textContent = "Checking…";
      try {
        await fetchDb(TABS[0][0], pw);
        token = pw;
        sessionStorage.setItem("portal_token", pw);
        showPortal();
      } catch (err) {
        $("login-error").textContent =
          err.status === 401 ? "Wrong password." : err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = "Unlock";
      }
    });

    $("logout").addEventListener("click", () => {
      sessionStorage.removeItem("portal_token");
      token = null;
      $("pw").value = "";
      $("portal").classList.add("hidden");
      $("login").classList.remove("hidden");
    });

    $("refresh").addEventListener("click", () => load(activeTab));

    function buildTabs() {
      $("tabs").innerHTML = TABS.map(
        ([key, label]) =>
          `<button class="tab${key === activeTab ? " active" : ""}" data-db="${key}">${label}</button>`
      ).join("");
      $("tabs").querySelectorAll(".tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          activeTab = btn.dataset.db;
          buildTabs();
          load(activeTab);
        });
      });
    }

    function showPortal() {
      $("login").classList.add("hidden");
      $("portal").classList.remove("hidden");
      buildTabs();
      load(activeTab);
    }

    function render(data) {
      if (!data.records.length) {
        $("view").innerHTML = '<div class="state">No records in this database.</div>';
        return;
      }
      const cols = data.columns;
      const head = cols.map((c) => `<th>${esc(c)}</th>`).join("");
      const rows = data.records
        .map((r) => {
          const cells = cols
            .map((c) => {
              const v = r.fields[c] ?? "";
              return `<td>${v === "" ? "—" : esc(v)}</td>`;
            })
            .join("");
          return `<tr>${cells}<td><a href="${esc(r.url)}" target="_blank" rel="noopener">Notion ↗</a></td></tr>`;
        })
        .join("");
      $("view").innerHTML =
        `<div class="table-scroll"><table><thead><tr>${head}<th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    async function load(db) {
      $("view").innerHTML = '<div class="state">Loading…</div>';
      $("count").textContent = "";
      try {
        const data = await fetchDb(db, token);
        $("count").textContent = `${data.count} record${data.count === 1 ? "" : "s"}`;
        render(data);
      } catch (err) {
        if (err.status === 401) {
          sessionStorage.removeItem("portal_token");
          token = null;
          $("portal").classList.add("hidden");
          $("login").classList.remove("hidden");
          $("login-error").textContent = "Session expired. Enter the password again.";
          return;
        }
        $("view").innerHTML = `<div class="state error">${esc(err.message)}</div>`;
      }
    }

    const saved = sessionStorage.getItem("portal_token");
    if (saved) {
      token = saved;
      showPortal();
    } else {
      $("login").classList.remove("hidden");
    }
  </script>

</body>
</html>
