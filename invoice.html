<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/order-fonts.css">
<style>
  /* Only what the shared stylesheet has no opinion about. */
  .order-layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 1.5rem;
    align-items: start;
  }
  @media (max-width: 800px) { .order-layout { grid-template-columns: 1fr; } }

  .inv-list { padding: 0; overflow: hidden; }
  .inv {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    width: 100%;
    padding: 0.7rem 1rem;
    border: 0;
    border-bottom: 1px solid var(--border);
    background: none;
    font: inherit;
    font-size: 13px;
    color: var(--text-primary);
    text-align: left;
    cursor: pointer;
    transition: var(--transition);
  }
  .inv:last-child { border-bottom: 0; }
  .inv:hover { background: var(--bg-elevated); }
  .inv[aria-current="true"] {
    background: var(--bg-elevated);
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .inv .no { font-weight: 600; color: var(--accent); }
  .inv .meta { color: var(--text-muted); font-size: 11px; margin-top: 0.15rem; }
  .inv .amt { white-space: nowrap; color: var(--text-secondary); }

  .stage { min-height: 260px; }
  .stage canvas {
    width: 100%;
    height: auto;
    display: block;
    border-radius: var(--radius-sm);
  }
  .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 1rem; }
  .hint { color: var(--text-muted); font-size: 12px; line-height: 1.6; }
  .fail { color: var(--error); font-size: 13px; line-height: 1.6; }
  .filter-row { display: flex; gap: 0.75rem; flex-wrap: wrap; }
  .filter-row input[type="search"] {
    flex: 1 1 240px;
    min-width: 0;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font: inherit;
    font-size: 13px;
    padding: 0.5rem 0.75rem;
  }
  .filter-row input[type="search"]:focus {
    outline: none;
    border-color: var(--accent);
  }
</style>
</head>
<body>
<div class="main-content">
  <div class="tool-view">
    <div class="view-header">
      <a class="btn btn-secondary" href="/">&larr; Tools</a>
    </div>
    <div>
      <h2>Orders</h2>
      <p class="hint">Open invoices only — those still unpaid or not yet handed over. Pick one, then save the image and send it to the buyer.</p>
    </div>

    <div class="filter-row">
      <input type="search" id="q" placeholder="Filter by invoice number, batch or status…" autocomplete="off">
    </div>

    <div class="order-layout">
      <div class="panel inv-list" id="list">
        <p class="hint" style="padding:1rem;margin:0">Loading invoices…</p>
      </div>
      <div class="panel stage" id="stage">
        <p class="hint" id="stage-note">Choose an invoice on the left to build its order image.</p>
      </div>
    </div>
  </div>
</div>

<script src="/order-draw.js"></script>
<script>
(function () {
  // Follow whatever theme the site was last set to; the toggle lives on the
  // tools page and stores its choice here.
  try {
    var saved = localStorage.getItem('sheen-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  } catch (e) { /* private mode — the default theme stands */ }

  var listEl = document.getElementById('list');
  var stageEl = document.getElementById('stage');
  var qEl = document.getElementById('q');
  var invoices = [];
  var current = null;
  var blobUrl = null;

  function money(n) {
    return 'PHP ' + (Number(n) || 0).toLocaleString('en-US', { maximumFractionDigits: 0 });
  }

  function note(msg, cls) {
    stageEl.innerHTML = '';
    var p = document.createElement('p');
    p.className = cls || 'hint';
    p.textContent = msg;
    stageEl.appendChild(p);
  }

  function render() {
    var term = qEl.value.trim().toLowerCase();
    var shown = invoices.filter(function (i) {
      if (!term) return true;
      return [i.number, i.batch, i.status, i.sellerStatus].join(' ').toLowerCase().indexOf(term) > -1;
    });

    if (!shown.length) {
      listEl.innerHTML = '<p class="hint" style="padding:1rem;margin:0">No matching invoices.</p>';
      return;
    }

    listEl.innerHTML = '';
    shown.forEach(function (i) {
      var b = document.createElement('button');
      b.className = 'inv';
      b.type = 'button';
      if (current === i.number) b.setAttribute('aria-current', 'true');

      var left = document.createElement('div');
      var no = document.createElement('div');
      no.className = 'no';
      no.textContent = i.number;
      var meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = [i.status, i.sellerStatus, i.batch].filter(Boolean).join(' · ');
      left.appendChild(no);
      left.appendChild(meta);

      var amt = document.createElement('div');
      amt.className = 'amt';
      amt.textContent = money(i.total);

      b.appendChild(left);
      b.appendChild(amt);
      b.addEventListener('click', function () { show(i.number); });
      listEl.appendChild(b);
    });
  }

  function show(number) {
    current = number;
    render();
    note('Building ' + number + '…');

    fetch('/api/invoice?inv=' + encodeURIComponent(number), { credentials: 'same-origin' })
      .then(function (res) {
        return res.json().then(function (body) {
          if (!res.ok) throw new Error(body.error || 'Request failed (' + res.status + ')');
          return body;
        });
      })
      // The embedded font must be loaded before drawing, or the first order
      // is measured and painted in a fallback face.
      .then(function (data) {
        var ready = document.fonts && document.fonts.load
          ? Promise.all([
              document.fonts.load('400 15px OrderMono'),
              document.fonts.load('700 15px OrderMono')
            ]).catch(function () {})
          : Promise.resolve();
        return ready.then(function () { return data; });
      })
      .then(function (data) {
        if (current !== number) return; // a later click won

        stageEl.innerHTML = '';
        var canvas = document.createElement('canvas');
        canvas.setAttribute('role', 'img');
        canvas.setAttribute('aria-label', 'Order for ' + number);
        stageEl.appendChild(canvas);
        OrderDraw.draw(canvas, data);

        var actions = document.createElement('div');
        actions.className = 'actions';

        var dl = document.createElement('a');
        dl.className = 'btn btn-primary';
        dl.textContent = 'Save image';
        dl.href = '#';
        dl.setAttribute('download', number + '.png');
        dl.addEventListener('click', function (e) {
          e.preventDefault();
          canvas.toBlob(function (blob) {
            if (blobUrl) URL.revokeObjectURL(blobUrl);
            blobUrl = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = blobUrl;
            a.download = number + '.png';
            document.body.appendChild(a);
            a.click();
            a.remove();
          }, 'image/png');
        });
        actions.appendChild(dl);

        var copy = document.createElement('button');
        copy.className = 'btn btn-secondary';
        copy.type = 'button';
        copy.textContent = 'Copy image';
        copy.addEventListener('click', function () {
          canvas.toBlob(function (blob) {
            if (!navigator.clipboard || !window.ClipboardItem) {
              copy.textContent = 'Not supported';
              return;
            }
            navigator.clipboard
              .write([new ClipboardItem({ 'image/png': blob })])
              .then(function () { copy.textContent = 'Copied'; })
              .catch(function () { copy.textContent = 'Copy failed'; });
          }, 'image/png');
        });
        actions.appendChild(copy);

        stageEl.appendChild(actions);
      })
      .catch(function (err) {
        if (current !== number) return;
        note('Could not build ' + number + ': ' + err.message, 'fail');
      });
  }

  qEl.addEventListener('input', render);

  fetch('/api/invoice?list=1', { credentials: 'same-origin' })
    .then(function (res) {
      return res.json().then(function (body) {
        if (!res.ok) throw new Error(body.error || 'Request failed (' + res.status + ')');
        return body;
      });
    })
    .then(function (body) {
      invoices = body.invoices || [];
      if (!invoices.length) {
        listEl.innerHTML = '<p class="hint" style="padding:1rem;margin:0">Nothing open \u2014 every invoice is paid and handed over.</p>';
        return;
      }
      render();
    })
    .catch(function (err) {
      listEl.innerHTML = '';
      var p = document.createElement('p');
      p.className = 'fail';
      p.style.padding = '1rem';
      p.textContent = 'Could not load invoices: ' + err.message;
      listEl.appendChild(p);
    });
})();
</script>
</body>
</html>
