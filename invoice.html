<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Receipts</title>
<style>
  :root {
    --bg: #faf7f2;
    --panel: #fffdfa;
    --ink: #1a1a1a;
    --muted: #8a8178;
    --rule: #e2dad0;
    --accent: #d3252b;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1rem 4rem; }

  header { margin-bottom: 1.75rem; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: 1px; }
  .sub { margin: .4rem 0 0; color: var(--muted); font-size: .9rem; }
  .back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .back:hover { color: var(--accent); }

  .controls { display: flex; gap: .75rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
  input[type="search"] {
    flex: 1 1 240px;
    min-width: 0;
    padding: .7rem .9rem;
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    background: var(--panel);
    font: inherit;
    font-size: .95rem;
    color: var(--ink);
  }
  input[type="search"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 1.5rem; align-items: start; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }

  .list { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); overflow: hidden; }
  .inv {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: .75rem;
    width: 100%;
    padding: .8rem 1rem;
    border: 0;
    border-bottom: 1px solid var(--rule);
    background: none;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .inv:last-child { border-bottom: 0; }
  .inv:hover { background: rgba(0,0,0,.03); }
  .inv[aria-current="true"] { background: rgba(211,37,43,.07); box-shadow: inset 3px 0 0 var(--accent); }
  .inv .no { font-weight: 600; font-size: .95rem; }
  .inv .meta { color: var(--muted); font-size: .78rem; margin-top: .15rem; }
  .inv .amt { font-size: .9rem; white-space: nowrap; }

  .stage { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); padding: 1.25rem; min-height: 300px; }
  .stage img { width: 100%; height: auto; display: block; border-radius: 8px; border: 1px solid var(--rule); }
  .actions { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1rem; }
  .btn {
    padding: .65rem 1.1rem;
    border-radius: var(--radius);
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    font: inherit;
    font-size: .9rem;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .btn.secondary { background: none; color: var(--ink); }
  .btn:disabled { opacity: .45; cursor: default; }

  .note { color: var(--muted); font-size: .85rem; line-height: 1.6; }
  .error { color: var(--accent); font-size: .9rem; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="/">&larr; Tools</a>
    <h1>Receipts</h1>
    <p class="sub">Pick an invoice, then save the image and send it to the buyer.</p>
  </header>

  <div class="controls">
    <input type="search" id="q" placeholder="Filter by invoice number, batch or status…" autocomplete="off">
  </div>

  <div class="layout">
    <div class="list" id="list"><p class="note" style="padding:1rem;margin:0">Loading invoices…</p></div>
    <div class="stage" id="stage">
      <p class="note" id="stage-note">Choose an invoice on the left to build its receipt.</p>
    </div>
  </div>
</div>

<script>
(function () {
  var listEl = document.getElementById('list');
  var stageEl = document.getElementById('stage');
  var qEl = document.getElementById('q');
  var invoices = [];
  var current = null;
  var blobUrl = null;

  function money(n) {
    return 'PHP ' + (Number(n) || 0).toLocaleString('en-US', { maximumFractionDigits: 0 });
  }

  function note(html, cls) {
    stageEl.innerHTML = '<p class="' + (cls || 'note') + '">' + html + '</p>';
  }

  function render() {
    var term = qEl.value.trim().toLowerCase();
    var shown = invoices.filter(function (i) {
      if (!term) return true;
      return [i.number, i.batch, i.status].join(' ').toLowerCase().indexOf(term) > -1;
    });

    if (!shown.length) {
      listEl.innerHTML = '<p class="note" style="padding:1rem;margin:0">No matching invoices.</p>';
      return;
    }

    listEl.innerHTML = '';
    shown.forEach(function (i) {
      var b = document.createElement('button');
      b.className = 'inv';
      b.type = 'button';
      if (current === i.number) b.setAttribute('aria-current', 'true');

      var left = document.createElement('div');
      var no = document.createElement('div');
      no.className = 'no';
      no.textContent = i.number;
      var meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = [i.status, i.batch].filter(Boolean).join(' · ');
      left.appendChild(no);
      left.appendChild(meta);

      var amt = document.createElement('div');
      amt.className = 'amt';
      amt.textContent = money(i.total);

      b.appendChild(left);
      b.appendChild(amt);
      b.addEventListener('click', function () { show(i.number); });
      listEl.appendChild(b);
    });
  }

  function show(number) {
    current = number;
    render();
    note('Building ' + number + '…');

    // Fetched as a blob so the same bytes can be previewed and saved, and so a
    // failure shows its message instead of a broken image.
    fetch('/api/invoice?inv=' + encodeURIComponent(number), { credentials: 'same-origin' })
      .then(function (res) {
        if (!res.ok) {
          return res.json()
            .catch(function () { return { error: 'Request failed (' + res.status + ')' }; })
            .then(function (body) { throw new Error(body.error || 'Request failed'); });
        }
        return res.blob();
      })
      .then(function (blob) {
        if (current !== number) return; // a later click won
        if (blobUrl) URL.revokeObjectURL(blobUrl);
        blobUrl = URL.createObjectURL(blob);

        stageEl.innerHTML = '';
        var img = document.createElement('img');
        img.src = blobUrl;
        img.alt = 'Receipt for ' + number;
        stageEl.appendChild(img);

        var actions = document.createElement('div');
        actions.className = 'actions';

        var dl = document.createElement('a');
        dl.className = 'btn';
        dl.href = blobUrl;
        dl.download = number + '.png';
        dl.textContent = 'Save image';
        actions.appendChild(dl);

        var open = document.createElement('a');
        open.className = 'btn secondary';
        open.href = '/api/invoice?inv=' + encodeURIComponent(number);
        open.target = '_blank';
        open.rel = 'noopener';
        open.textContent = 'Open in new tab';
        actions.appendChild(open);

        stageEl.appendChild(actions);
      })
      .catch(function (err) {
        if (current !== number) return;
        note('Could not build ' + number + ': ' + err.message, 'error');
      });
  }

  qEl.addEventListener('input', render);

  fetch('/api/invoice?list=1', { credentials: 'same-origin' })
    .then(function (res) {
      if (!res.ok) {
        return res.json()
          .catch(function () { return { error: 'Request failed (' + res.status + ')' }; })
          .then(function (body) { throw new Error(body.error || 'Request failed'); });
      }
      return res.json();
    })
    .then(function (body) {
      invoices = body.invoices || [];
      if (!invoices.length) {
        listEl.innerHTML = '<p class="note" style="padding:1rem;margin:0">No invoices found.</p>';
        return;
      }
      render();
    })
    .catch(function (err) {
      listEl.innerHTML = '<p class="error" style="padding:1rem;margin:0">Could not load invoices: '
        + err.message + '</p>';
    });
})();
</script>
</body>
</html>
