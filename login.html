<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sheen.dev</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a1c18;
      --card: #242821;
      --elevated: #2a2f25;
      --border: #4a5441;
      --text: #f1f3ec;
      --muted: #a9ba9d;
      --accent: #d4e157;
      --error: #c0413c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Roboto Mono', ui-monospace, Menlo, monospace;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 340px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.75rem;
    }

    .brand { font-size: 1.05rem; font-weight: 700; color: var(--accent); }
    .sub { color: var(--muted); font-size: 0.8rem; margin-bottom: 1.5rem; }

    label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    input {
      width: 100%;
      height: 2.3rem;
      padding: 0 0.6rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
    }

    input:focus { outline: none; border-color: var(--accent); }

    button {
      width: 100%;
      height: 2.3rem;
      margin-top: 1rem;
      background: var(--accent);
      color: #1a1c18;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .msg { color: var(--error); font-size: 0.78rem; min-height: 1.1rem; margin-top: 0.7rem; }
  </style>
</head>
<body>
  <form class="card" id="form">
    <div class="brand">sheen.dev</div>
    <div class="sub">Private site. Enter the password to continue.</div>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus required>
    <div class="msg" id="msg"></div>
    <button id="btn" type="submit">Enter</button>
  </form>

  <script>
    // Only same-origin paths, so ?next= can't be used to bounce somewhere else.
    function safeNext() {
      const raw = new URLSearchParams(location.search).get("next") || "/";
      return /^\/(?!\/)/.test(raw) ? raw : "/";
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn");
      const msg = document.getElementById("msg");
      msg.textContent = "";
      btn.disabled = true;
      btn.textContent = "Checking…";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: document.getElementById("pw").value }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.error || `Failed (${res.status})`);
        }
        location.replace(safeNext());
      } catch (err) {
        msg.textContent = err.message;
        document.getElementById("pw").select();
      } finally {
        btn.disabled = false;
        btn.textContent = "Enter";
      }
    });
  </script>
</body>
</html>
