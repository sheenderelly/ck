<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalog — sheen.dev</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css?v=11">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    .cat-toolbar {
      display: flex;
      gap: var(--spacing-tight);
      align-items: center;
      flex-wrap: wrap;
    }

    .cat-toolbar input[type="search"],
    .cat-toolbar select {
      height: 2.1rem;
      padding: 0 0.55rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: var(--font-family);
      font-size: 0.9rem;
    }

    /* style.css sets width:100% on inputs and selects, which would stack these. */
    .cat-toolbar input[type="search"] { flex: 1 1 14rem; width: auto; min-width: 11rem; }
    .cat-toolbar select { flex: 0 0 auto; width: auto; max-width: 16rem; }
    .cat-toolbar input:focus, .cat-toolbar select:focus { outline: none; border-color: var(--accent); }
    .cat-count { color: var(--text-muted); font-size: 0.8rem; }

    /* Cards follow the brand, not the UI theme: product cut-outs are shot against
       white, and the whole look is a light card with a red price. */
    :root {
      --card-bg: #faf7f2;
      --card-edge: #e6ded2;
      --card-ink: #2b2a27;
      --card-muted: #8d8579;
      --price-red: #d3252b;
      --sakura: #f2a8c0;
      --product-bg: #ffffff;
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
      gap: 1.1rem;
    }

    .cat-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 0.9rem 0.85rem;
      background: var(--card-bg);
      border: 1px solid var(--card-edge);
      border-radius: 14px;
      overflow: hidden;
      transition: var(--transition);
    }

    .cat-card:hover { transform: translateY(-3px); box-shadow: 0 10px 22px -12px rgba(0, 0, 0, 0.45); }

    .cat-sakura {
      position: absolute;
      top: 0;
      right: 0;
      width: 84px;
      height: 84px;
      opacity: 0.85;
      pointer-events: none;
    }

    .cat-thumb {
      appearance: none;
      border: none;
      padding: 0;
      margin: 0;
      display: block;
      width: 86%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--product-bg);
      box-shadow: 0 0 0 1px var(--card-edge);
      cursor: zoom-in;
      overflow: hidden;
    }

    .cat-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cat-thumb.is-empty { cursor: default; }

    .cat-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c4bcae;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .cat-body {
      width: 100%;
      margin-top: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      flex: 1;
    }

    .cat-name {
      font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
      color: var(--card-ink);
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .cat-lineup {
      font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.62rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--card-muted);
      text-align: center;
    }

    .cat-price {
      font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
      margin-top: auto;
      padding-top: 0.5rem;
      display: flex;
      align-items: baseline;
      justify-content: center;
      color: var(--price-red);
      line-height: 1;
    }

    .cat-peso { font-size: 1rem; font-weight: 700; margin-right: 0.04em; }
    .cat-amount { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; }

    .cat-price.is-missing {
      color: var(--card-muted);
      font-size: 0.72rem;
      font-weight: 500;
      padding-top: 0.7rem;
    }

    .state-msg {
      padding: 2.5rem 1rem;
      text-align: center;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-card);
    }

    .state-msg.is-error { color: var(--error); border-color: var(--error); }

    /* Lightbox */
    .lb {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3.5rem 1rem 4.5rem;
    }

    .lb[hidden] { display: none; }

    .lb-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: var(--radius-sm);
      background: var(--product-bg);
    }

    .lb-cap {
      position: absolute;
      left: 50%;
      bottom: 1.1rem;
      transform: translateX(-50%);
      max-width: min(90vw, 40rem);
      text-align: center;
      color: #f1f3ec;
      font-size: 0.8rem;
      white-space: pre-line;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    .lb-btn {
      position: absolute;
      appearance: none;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #f1f3ec;
      border-radius: 50%;
      width: 2.5rem;
      height: 2.5rem;
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lb-btn:hover { background: rgba(0, 0, 0, 0.75); border-color: var(--accent); color: var(--accent); }
    .lb-close { top: 1rem; right: 1rem; }
    .lb-prev { left: 1rem; top: 50%; transform: translateY(-50%); }
    .lb-next { right: 1rem; top: 50%; transform: translateY(-50%); }
    .lb-btn[hidden] { display: none; }

    @media (max-width: 520px) {
      .cat-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="app-header-inner">
      <div class="brand-mark">
        <i data-lucide="book-image"></i>
        <div>
          <div class="brand-title">Catalog</div>
          <div class="brand-sub">sheen.dev</div>
        </div>
      </div>
      <div class="theme-switch" role="group" aria-label="Theme toggle">
        <button id="theme-dark" class="active" type="button"><i data-lucide="moon"></i> Dark</button>
        <button id="theme-light" type="button"><i data-lucide="sun"></i> Light</button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="tool-view view-active">
      <div class="view-header">
        <a class="back-btn" href="/pasabuy"><i data-lucide="arrow-left"></i> Portal</a>
        <h2>Products</h2>
      </div>

      <div class="cat-toolbar">
        <input id="q" type="search" placeholder="Search products…" autocomplete="off">
        <select id="lineup"><option value="">All lineups</option></select>
        <span class="cat-count" id="count"></span>
      </div>

      <div id="body"><div class="state-msg">Loading…</div></div>
    </div>
  </main>

  <div class="lb" id="lb" hidden>
    <button class="lb-btn lb-close" id="lb-close" aria-label="Close">×</button>
    <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous">‹</button>
    <img class="lb-img" id="lb-img" alt="">
    <button class="lb-btn lb-next" id="lb-next" aria-label="Next">›</button>
    <div class="lb-cap" id="lb-cap"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (v) =>
      String(v).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
      );

    /* ---- theme (shared with the rest of the site) ---- */
    function applyTheme(mode) {
      document.documentElement.setAttribute("data-theme", mode);
      $("theme-dark").classList.toggle("active", mode === "dark");
      $("theme-light").classList.toggle("active", mode === "light");
      try { localStorage.setItem("sheen-theme", mode); } catch (e) {}
    }
    $("theme-dark").addEventListener("click", () => applyTheme("dark"));
    $("theme-light").addEventListener("click", () => applyTheme("light"));
    try { applyTheme(localStorage.getItem("sheen-theme") || "dark"); } catch (e) { applyTheme("dark"); }

    /* ---- data ---- */
    let items = [];   // every product
    let shown = [];   // what the current filters leave visible

    const peso = (n) =>
      Number.isFinite(Number(n)) && n !== "" ? "₱" + Number(n).toLocaleString("en-PH") : null;

    const initials = (name) =>
      String(name).replace(/[^A-Za-z0-9 ]/g, " ").trim().split(/\s+/).slice(0, 2)
        .map((w) => w[0]).join("").toUpperCase() || "—";

    // One blossom cluster, reused in every card corner.
    const SAKURA = `<svg class="cat-sakura" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="var(--sakura)">
        ${[
          [74, 20, 1.15],
          [50, 12, 0.72],
          [88, 44, 0.6],
        ]
          .map(
            ([x, y, s]) => `<g transform="translate(${x},${y}) scale(${s})">
              ${[0, 72, 144, 216, 288]
                .map((deg) => `<ellipse cx="0" cy="-9" rx="5.4" ry="8" transform="rotate(${deg})"/>`)
                .join("")}
              <circle r="2.5" fill="#e0789c"/>
            </g>`
          )
          .join("")}
      </g>
    </svg>`;

    function toProduct(r) {
      const f = r.fields;
      const name = f["product name"] || f["item name "] || f["jp name"] || "Untitled";
      const image = r.media && r.media.image ? r.media.image[0].url : null;
      const raw = f["list price"];
      const amount =
        Number.isFinite(Number(raw)) && raw !== "" ? Number(raw).toLocaleString("en-PH") : null;
      return {
        name,
        image,
        lineup: f.lineup || "",
        spec: f.spec || "",
        amount,
        price: amount ? "₱" + amount : null,
        search: [name, f.lineup, f.spec, f["jp name"], f["jan code"]].join(" ").toLowerCase(),
      };
    }

    function render() {
      const q = $("q").value.trim().toLowerCase();
      const lineup = $("lineup").value;
      shown = items.filter(
        (p) => (!q || p.search.includes(q)) && (!lineup || p.lineup === lineup)
      );

      $("count").textContent =
        shown.length === items.length
          ? `${items.length} product${items.length === 1 ? "" : "s"}`
          : `${shown.length} of ${items.length}`;

      if (!shown.length) {
        $("body").innerHTML = '<div class="state-msg">Nothing matches that.</div>';
        return;
      }

      $("body").innerHTML =
        '<div class="cat-grid">' +
        shown
          .map((p, i) => {
            const thumb = p.image
              ? `<button class="cat-thumb" data-i="${i}" aria-label="View image">
                   <img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy"></button>`
              : `<div class="cat-thumb is-empty"><div class="cat-placeholder">${esc(initials(p.name))}</div></div>`;
            const price = p.amount
              ? `<div class="cat-price"><span class="cat-peso">₱</span><span class="cat-amount">${esc(p.amount)}</span></div>`
              : '<div class="cat-price is-missing">No price yet</div>';
            return `<article class="cat-card">
              ${SAKURA}
              ${thumb}
              <div class="cat-body">
                <div class="cat-name">${esc(p.name)}</div>
                ${p.lineup ? `<div class="cat-lineup">${esc(p.lineup)}</div>` : ""}
                ${price}
              </div>
            </article>`;
          })
          .join("") +
        "</div>";

      $("body").querySelectorAll(".cat-thumb[data-i]").forEach((el) => {
        el.addEventListener("click", () => openLightbox(Number(el.dataset.i)));
      });
    }

    /* ---- lightbox ---- */
    let lbIndex = -1;

    function withImages() {
      return shown.map((p, i) => ({ p, i })).filter((x) => x.p.image);
    }

    function openLightbox(i) {
      lbIndex = i;
      paintLightbox();
      $("lb").hidden = false;
      document.body.style.overflow = "hidden";
      $("lb-close").focus();
    }

    function closeLightbox() {
      $("lb").hidden = true;
      $("lb-img").src = "";
      document.body.style.overflow = "";
    }

    function paintLightbox() {
      const p = shown[lbIndex];
      if (!p) return closeLightbox();
      $("lb-img").src = p.image;
      $("lb-img").alt = p.name;
      $("lb-cap").textContent = p.price ? `${p.name}  ·  ${p.price}` : p.name;
      const list = withImages();
      const at = list.findIndex((x) => x.i === lbIndex);
      $("lb-prev").hidden = list.length < 2;
      $("lb-next").hidden = list.length < 2;
      $("lb-prev").dataset.to = list[(at - 1 + list.length) % list.length]?.i ?? lbIndex;
      $("lb-next").dataset.to = list[(at + 1) % list.length]?.i ?? lbIndex;
    }

    $("lb-close").addEventListener("click", closeLightbox);
    $("lb-prev").addEventListener("click", () => { lbIndex = Number($("lb-prev").dataset.to); paintLightbox(); });
    $("lb-next").addEventListener("click", () => { lbIndex = Number($("lb-next").dataset.to); paintLightbox(); });
    $("lb").addEventListener("click", (e) => { if (e.target === $("lb")) closeLightbox(); });

    document.addEventListener("keydown", (e) => {
      if ($("lb").hidden) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") $("lb-prev").click();
      if (e.key === "ArrowRight") $("lb-next").click();
    });

    /* ---- load ---- */
    $("q").addEventListener("input", render);
    $("lineup").addEventListener("change", render);

    (async () => {
      try {
        const res = await fetch("/api/notion?db=products");
        if (res.status === 401) return location.replace("/login?next=/catalog");
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.error || `Request failed (${res.status})`);
        }
        const data = await res.json();
        items = data.records.map(toProduct).sort((a, b) => a.name.localeCompare(b.name));

        const lineups = [...new Set(items.map((p) => p.lineup).filter(Boolean))].sort();
        $("lineup").insertAdjacentHTML(
          "beforeend",
          lineups.map((l) => `<option value="${esc(l)}">${esc(l)}</option>`).join("")
        );
        render();
      } catch (err) {
        $("body").innerHTML = `<div class="state-msg is-error">${esc(err.message)}</div>`;
      }
    })();

    if (window.lucide) lucide.createIcons();
  </script>

</body>
</html>
